[project]
name = "literature-agent"
version = "0.1.0"
description = "LangGraph literature research baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-openai>=1,<2",
    "langchain-tavily>=0.2,<1",
    "langgraph>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
