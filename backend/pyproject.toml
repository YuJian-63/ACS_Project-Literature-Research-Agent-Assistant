[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "literature-research-backend"
version = "0.1.0"
description = "Application backend for the Literature Research Agent Assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
