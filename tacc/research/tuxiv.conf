entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: acs-network-probe
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: acs-DISPATCH_ID
  general:
    - job-name=acs-DISPATCH_ID
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:30:00
    - output=${TACC_SLURM_USERLOG}/acs-DISPATCH_ID-%j.log
