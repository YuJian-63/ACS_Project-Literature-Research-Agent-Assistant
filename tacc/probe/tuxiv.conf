entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: acs-network-probe
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: api-probe
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:10:00
    - output=${TACC_SLURM_USERLOG}/api-probe-%j.log
